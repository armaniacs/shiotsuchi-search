[package]
name = "shiotsuchi-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
description = "Japanese-aware search engine core library — tokenizer, indexer, FTS5/vector search"

[dependencies]
rusqlite = { version = "0.39", features = ["bundled"] }
# NOTE: "load_extension" は不要。Rust 側でトークナイズするため。

# sqlite-vaporetto と同一の feature flags を指定する。
# charwise-pma は日本語の文字単位 PMA を有効化し、速度に最も影響する。
vaporetto = { version = "0.6", default-features = false, features = [
    "std",
    "tag-prediction",
    "cache-type-score",
    "fix-weight-length",
    "charwise-pma",
] }
vaporetto_rules = { version = "0.6", default-features = false }
ruzstd = "0.8"  # sqlite-vaporetto と同じ。.model.zst の zstd 解凍に使用。
walkdir = "2"
rayon = "1"
sha2 = "0.11"
hex = "0.4"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
thiserror = "2"
# ONNX Runtime binaries are downloaded at build time via the `download-binaries` feature.
# For production, set ORT_LIB_LOCATION env var to use system-installed ONNX Runtime instead.
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "tls-rustls"], optional = true }
indicatif = "0.17"
notify = { version = "9.0.0-rc.4", optional = true }
log = "0.4"
dirs = "6"
config = { version = "0.15", features = ["toml"] }
sqlite-vec = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"], optional = true }
unicode-normalization = "0.1"
toml = "1.1"
regex = "1"
ureq = { version = "3", optional = true }
pdfium-render = { version = "0.8", default-features = false, optional = true }
pdfium-auto = { version = "0.3", features = ["bundled"], optional = true }
edgequake-pdf2md = { version = "0.9", default-features = false, features = ["bundled"], optional = true }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }

[features]
default = ["watcher", "async-index", "semantic", "pdf"]
semantic = ["dep:ort", "dep:ureq"]
watcher = ["dep:notify"]
async-index = ["dep:tokio"]
pdf = ["dep:pdfium-render", "dep:pdfium-auto"]
vlm = ["dep:edgequake-pdf2md", "dep:tokio", "pdf"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[bench]]
name = "search_bench"
harness = false

[[bench]]
name = "quantization"
harness = false

[build-dependencies]
vaporetto = { version = "0.6", default-features = false, features = [
    "std",
    "tag-prediction",
    "cache-type-score",
    "fix-weight-length",
    "charwise-pma",
] }
ruzstd = "0.8"
sha2 = "0.11"
hex = "0.4"
