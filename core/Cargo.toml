[package]
name = "shiotsuchi-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
# NOTE: "load_extension" は不要。Rust 側でトークナイズするため。

# sqlite-vaporetto と同一の feature flags を指定する。
# charwise-pma は日本語の文字単位 PMA を有効化し、速度に最も影響する。
vaporetto = { version = "0.6", default-features = false, features = [
    "std",
    "tag-prediction",
    "cache-type-score",
    "fix-weight-length",
    "charwise-pma",
] }
vaporetto_rules = { version = "0.6", default-features = false }
ruzstd = "0.8"  # sqlite-vaporetto と同じ。.model.zst の zstd 解凍に使用。
pulldown-cmark = "0.11"
walkdir = "2"
rayon = "1"
sha2 = "0.10"
hex = "0.4"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.19", default-features = false, features = ["onig"] }
thiserror = "1"
# ort's "download-binaries" feature removed — ONNX Runtime binaries are installed manually
# via `shiotsuchi setup` (see cli/src/commands/setup.rs). Set ORT_LIB_LOCATION env var.
ort = { version = "2.0.0-rc.12", default-features = false }
indicatif = "0.17"
notify = { version = "6", optional = true }
log = "0.4"
dirs = "5"
ndarray = "0.15"
sqlite-vec = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"], optional = true }

[features]
default = ["watcher"]
watcher = ["dep:notify"]
async-index = ["dep:tokio"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[bench]]
name = "search_bench"
harness = false

[build-dependencies]
vaporetto = { version = "0.6", default-features = false, features = [
    "std",
    "tag-prediction",
    "cache-type-score",
    "fix-weight-length",
    "charwise-pma",
] }
ruzstd = "0.8"
sha2 = "0.10"
