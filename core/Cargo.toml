[package]
name = "shiotsuchi-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "0.39", features = ["bundled"] }
# NOTE: "load_extension" は不要。Rust 側でトークナイズするため。

# sqlite-vaporetto と同一の feature flags を指定する。
# charwise-pma は日本語の文字単位 PMA を有効化し、速度に最も影響する。
vaporetto = { version = "0.6", default-features = false, features = [
    "std",
    "tag-prediction",
    "cache-type-score",
    "fix-weight-length",
    "charwise-pma",
] }
vaporetto_rules = { version = "0.6", default-features = false }
ruzstd = "0.8"  # sqlite-vaporetto と同じ。.model.zst の zstd 解凍に使用。
walkdir = "2"
rayon = "1"
sha2 = "0.11"
hex = "0.4"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
thiserror = "2"
# ONNX Runtime binaries are downloaded at build time via the `download-binaries` feature.
# For production, set ORT_LIB_LOCATION env var to use system-installed ONNX Runtime instead.
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
indicatif = "0.17"
notify = { version = "9.0.0-rc.4", optional = true }
log = "0.4"
dirs = "5"
config = { version = "0.14", features = ["toml"] }
sqlite-vec = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"], optional = true }

[features]
default = ["watcher", "async-index"]
watcher = ["dep:notify"]
async-index = ["dep:tokio"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[bench]]
name = "search_bench"
harness = false

[[bench]]
name = "quantization"
harness = false

[build-dependencies]
vaporetto = { version = "0.6", default-features = false, features = [
    "std",
    "tag-prediction",
    "cache-type-score",
    "fix-weight-length",
    "charwise-pma",
] }
ruzstd = "0.8"
sha2 = "0.11"
hex = "0.4"
