<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shiotsuchi search</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #334155;
      --border: #334155;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
      --success: #4ade80;
      --error: #f87171;
      --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .container { max-width: 800px; margin: 0 auto; padding: 2rem 1rem; }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-size: 1.5rem; font-weight: 600; color: var(--accent); }
    header p { color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem; }

    /* Screen-reader only utility */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    /* Tabs */
    .tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .tab {
      padding: 0.75rem 1.25rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.875rem;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }

    /* Search */
    .search-box {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .search-box input {
      flex: 1;
      padding: 0.75rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box input::placeholder { color: var(--text-muted); }
    .search-box button {
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .search-box button:hover { background: var(--accent-hover); }
    .search-box button:disabled { opacity: 0.5; cursor: not-allowed; }
    .search-box button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .options {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .options label { color: var(--text-muted); font-size: 0.8rem; }
    .options select, .options input[type="number"] {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      padding: 0.35rem 0.5rem;
      font-size: 0.8rem;
    }

    /* Results */
    .results-info { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 1rem; }
    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 0.75rem;
      transition: border-color 0.15s;
      cursor: pointer;
    }
    .result-card:hover { border-color: var(--accent); }
    .result-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .result-title {
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.25rem;
      font-size: 0.95rem;
    }
    .result-path {
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-bottom: 0.5rem;
      font-family: monospace;
    }
    .result-snippet {
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .result-score {
      color: var(--text-muted);
      font-size: 0.7rem;
      margin-top: 0.5rem;
      text-align: right;
    }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      text-align: center;
    }
    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--accent);
    }
    .stat-label {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 0.25rem;
    }

    /* File list */
    .file-list { list-style: none; }
    .file-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.875rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .file-item:hover { border-color: var(--accent); }
    .file-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .file-name { font-weight: 500; }
    .file-vault { color: var(--text-muted); font-size: 0.75rem; font-family: monospace; }

    /* Load more button */
    .load-more {
      display: block;
      width: 100%;
      padding: 0.75rem;
      margin-top: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--accent);
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .load-more:hover { background: var(--surface-hover); }
    .load-more:disabled { opacity: 0.5; cursor: not-allowed; }

    /* File viewer modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 900px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .modal-title {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--accent);
      font-family: monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 80%;
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.25rem;
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
    }
    .modal-close:hover { color: var(--text); background: var(--surface-hover); }
    .modal-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .modal-body {
      padding: 1.25rem;
      overflow-y: auto;
      flex: 1;
    }
    .modal-body pre {
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
      color: var(--text);
    }
    .modal-loading { text-align: center; color: var(--text-muted); padding: 3rem; }

    /* Loading & empty */
    .loading { text-align: center; color: var(--text-muted); padding: 2rem; }
    .empty { text-align: center; color: var(--text-muted); padding: 2rem; font-size: 0.9rem; }
    .error { color: var(--error); padding: 1rem; text-align: center; }

    .panel { display: none; }
    .panel.active { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>shiotsuchi search</h1>
      <p>Japanese-aware search for Markdown vaults</p>
    </header>

    <div class="tabs" role="tablist" aria-label="Navigation tabs">
      <button class="tab active" role="tab" aria-selected="true" aria-controls="search" id="tab-search" data-tab="search">Search</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="stats" id="tab-stats" data-tab="stats">Stats</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="files" id="tab-files" data-tab="files">Files</button>
    </div>

    <!-- Search Panel -->
    <div id="search" class="panel active" role="tabpanel" aria-labelledby="tab-search">
      <div class="search-box">
        <label for="query" class="sr-only">Search notes</label>
        <input type="text" id="query" placeholder="Search notes..." autofocus aria-label="Search notes">
        <button id="searchBtn" onclick="doSearch()">Search</button>
      </div>
      <div class="options">
        <div>
          <label for="mode">Mode</label><br>
          <select id="mode">
            <option value="hybrid">Hybrid</option>
            <option value="fts">Full-text</option>
          </select>
        </div>
        <div>
          <label for="limit">Limit</label><br>
          <input type="number" id="limit" value="20" min="1" max="100" style="width: 70px;">
        </div>
      </div>
      <div id="searchResults" aria-live="polite" role="region" aria-label="Search results"></div>
    </div>

    <!-- Stats Panel -->
    <div id="stats" class="panel" role="tabpanel" aria-labelledby="tab-stats">
      <div id="statsContent"></div>
    </div>

    <!-- Files Panel -->
    <div id="files" class="panel" role="tabpanel" aria-labelledby="tab-files">
      <div id="filesContent" aria-live="polite" role="region" aria-label="Indexed files"></div>
    </div>
  </div>

  <!-- File Viewer Modal -->
  <div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-label="File viewer">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle"></span>
        <button class="modal-close" id="modalCloseBtn" aria-label="Close file viewer">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);

    // --- Fetch with timeout ---
    const TIMEOUT_MS = 15000;
    async function apiWithTimeout(path) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
      try {
        const resp = await fetch(path, { signal: controller.signal });
        clearTimeout(timer);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        return await resp.json();
      } catch (e) {
        clearTimeout(timer);
        if (e.name === 'AbortError') {
          throw new Error('Request timed out. The server may be unreachable.');
        }
        throw e;
      }
    }

    // --- Tab switching (keyboard + mouse) ---
    const tabs = document.querySelectorAll('.tab');
    const panels = document.querySelectorAll('.panel');

    function switchTab(tab) {
      tabs.forEach(t => {
        t.classList.remove('active');
        t.setAttribute('aria-selected', 'false');
      });
      panels.forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      tab.setAttribute('aria-selected', 'true');
      const panel = $('#' + tab.dataset.tab);
      panel.classList.add('active');
      if (tab.dataset.tab === 'stats') loadStats();
      if (tab.dataset.tab === 'files') loadFiles();
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', () => switchTab(tab));
      tab.addEventListener('keydown', (e) => {
        const tabList = Array.from(tabs);
        const idx = tabList.indexOf(tab);
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          const next = tabList[(idx + 1) % tabList.length];
          next.focus();
          switchTab(next);
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          const prev = tabList[(idx - 1 + tabList.length) % tabList.length];
          prev.focus();
          switchTab(prev);
        }
      });
    });

    // Enter key to search
    $('#query').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doSearch();
    });

    // --- Modal focus trap ---
    let previousFocus = null;

    function openModalFocusTrap() {
      const modal = $('#modal');
      const focusable = modal.querySelectorAll('button, [tabindex]:not([tabindex="-1"])');
      if (focusable.length === 0) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];

      modal._trapHandler = (e) => {
        if (e.key !== 'Tab') return;
        if (e.shiftKey) {
          if (document.activeElement === first) {
            e.preventDefault();
            last.focus();
          }
        } else {
          if (document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
      };
      modal.addEventListener('keydown', modal._trapHandler);
      first.focus();
    }

    function removeModalFocusTrap() {
      const modal = $('#modal');
      if (modal._trapHandler) {
        modal.removeEventListener('keydown', modal._trapHandler);
        modal._trapHandler = null;
      }
    }

    // Close modal on overlay click, Escape, or close button
    $('#modal').addEventListener('click', (e) => {
      if (e.target === $('#modal')) closeModal();
    });
    $('#modalCloseBtn').addEventListener('click', closeModal);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && $('#modal').classList.contains('open')) closeModal();
    });

    // --- Search ---
    async function doSearch() {
      const q = $('#query').value.trim();
      if (!q) return;
      const mode = $('#mode').value;
      const limit = $('#limit').value;
      const btn = $('#searchBtn');
      btn.disabled = true;
      btn.textContent = 'Searching...';
      $('#searchResults').innerHTML = '<div class="loading">Searching...</div>';

      try {
        const data = await apiWithTimeout(`/api/v1/search?q=${encodeURIComponent(q)}&mode=${mode}&limit=${limit}`);
        if (data.error) {
          $('#searchResults').innerHTML = `<div class="error">${esc(data.error.message)}</div>`;
          return;
        }
        if (data.results.length === 0) {
          $('#searchResults').innerHTML = '<div class="empty">No results found</div>';
          return;
        }
        $('#searchResults').innerHTML = `
          <div class="results-info">${data.count} results</div>
          ${data.results.map(r => `
            <div class="result-card" role="button" tabindex="0"
                 onclick="openFile('${esc(r.file_path)}', '${esc(r.vault_name)}')"
                 onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openFile('${esc(r.file_path)}', '${esc(r.vault_name)}')}">
              <div class="result-title">${esc(r.title || '(untitled)')}</div>
              <div class="result-path">${esc(r.file_path)}</div>
              <div class="result-snippet">${esc(r.snippet)}</div>
              <div class="result-score">score: ${r.score.toFixed(3)}</div>
            </div>
          `).join('')}
        `;
      } catch (e) {
        $('#searchResults').innerHTML = `<div class="error">${esc(e.message)}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Search';
      }
    }

    // --- Stats ---
    async function loadStats() {
      $('#statsContent').innerHTML = '<div class="loading">Loading...</div>';
      try {
        const d = await apiWithTimeout('/api/v1/stats');
        $('#statsContent').innerHTML = `
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-value">${d.total_files}</div>
              <div class="stat-label">Files</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${d.total_chunks}</div>
              <div class="stat-label">Chunks</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${formatBytes(d.total_size_bytes)}</div>
              <div class="stat-label">Total Size</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${esc(d.embedder_status)}</div>
              <div class="stat-label">Embedder</div>
            </div>
          </div>
        `;
      } catch (e) {
        $('#statsContent').innerHTML = `<div class="error">${esc(e.message)}</div>`;
      }
    }

    // --- Files with pagination ---
    let filesOffset = 0;
    const FILES_PAGE_SIZE = 50;
    let filesTotal = 0;

    async function loadFiles(reset = true) {
      if (reset) {
        filesOffset = 0;
        $('#filesContent').innerHTML = '<div class="loading">Loading...</div>';
      }

      try {
        const d = await apiWithTimeout(`/api/v1/list?offset=${filesOffset}&limit=${FILES_PAGE_SIZE}`);
        filesTotal = d.total;

        if (filesTotal === 0) {
          $('#filesContent').innerHTML = '<div class="empty">No files indexed</div>';
          return;
        }

        const existingList = reset ? '' : ($('#fileListUl') ? $('#fileListUl').outerHTML : '');
        const newItems = d.files.map(f => `
          <li class="file-item" role="button" tabindex="0"
              onclick="openFile('${esc(f.path)}', '${esc(f.vault_name)}')"
              onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openFile('${esc(f.path)}', '${esc(f.vault_name)}')}">
            <span class="file-name">${esc(f.path)}</span>
            <span class="file-vault">${esc(f.vault_name)}</span>
          </li>
        `).join('');

        let html = `<div class="results-info">${d.count} of ${filesTotal} files</div>`;
        if (reset) {
          html += `<ul class="file-list" id="fileListUl">${newItems}</ul>`;
        } else {
          const list = $('#fileListUl');
          if (list) {
            list.insertAdjacentHTML('beforeend', newItems);
          } else {
            html += `<ul class="file-list" id="fileListUl">${newItems}</ul>`;
          }
        }

        filesOffset += d.files.length;
        if (filesOffset < filesTotal) {
          html += `<button class="load-more" id="loadMoreBtn" onclick="loadFiles(false)">
            Load more (${filesOffset} of ${filesTotal})
          </button>`;
        } else if (reset) {
          // No load more needed if all loaded on first page
        }

        if (reset) {
          $('#filesContent').innerHTML = html;
        } else {
          const loadMore = $('#loadMoreBtn');
          if (loadMore) loadMore.remove();
          if (filesOffset < filesTotal) {
            $('#filesContent').insertAdjacentHTML('beforeend',
              `<button class="load-more" id="loadMoreBtn" onclick="loadFiles(false)">
                Load more (${filesOffset} of ${filesTotal})
              </button>`);
          }
        }
      } catch (e) {
        $('#filesContent').innerHTML = `<div class="error">${esc(e.message)}</div>`;
      }
    }

    // --- File viewer ---
    async function openFile(path, vault) {
      const modal = $('#modal');
      const title = $('#modalTitle');
      const body = $('#modalBody');

      previousFocus = document.activeElement;
      title.textContent = path;
      modal.setAttribute('aria-label', 'Note content: ' + path);
      body.innerHTML = '<div class="modal-loading">Loading...</div>';
      modal.classList.add('open');
      openModalFocusTrap();

      try {
        const data = await apiWithTimeout(`/api/v1/read?path=${encodeURIComponent(path)}&vault=${encodeURIComponent(vault)}`);
        if (data.error) {
          body.innerHTML = `<div class="error">${esc(data.error.message)}</div>`;
          return;
        }
        body.innerHTML = `<pre>${esc(data.content)}</pre>`;
      } catch (e) {
        body.innerHTML = `<div class="error">${esc(e.message)}</div>`;
      }
    }

    function closeModal() {
      const modal = $('#modal');
      modal.classList.remove('open');
      removeModalFocusTrap();
      if (previousFocus) {
        previousFocus.focus();
        previousFocus = null;
      }
    }

    // --- Utilities ---
    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function formatBytes(b) {
      if (b === 0) return '0 B';
      const k = 1024, s = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(b) / Math.log(k));
      return parseFloat((b / Math.pow(k, i)).toFixed(1)) + ' ' + s[i];
    }
  </script>
</body>
</html>
