# cargo-deny configuration
# Install: cargo install cargo-deny
# Run: cargo deny check

[advisories]
vulnerability = "deny"
unmaintained = "warn"
notice = "warn"
yanked = "warn"

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    # Used by unicode-ident, proc-macro2, and similar proc-macro crates.
    # Unicode-3.0 is a permissive license compatible with MIT/Apache-2.0.
    "Unicode-3.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
allow-git = []
