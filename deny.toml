# cargo-deny configuration
# Install: cargo install cargo-deny
# Run: cargo deny check

[advisories]
vulnerability = "deny"
unmaintained = "warn"
notice = "warn"
yanked = "warn"

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
skip-tree = [
    # edgequake-pdf2md uses pdfium-render 0.8.x while core uses 0.9.x
    # This is a known semver conflict that should be resolved upstream.
    { name = "pdfium-render", version = "0.8" },
]

[sources]
unknown-registry = "deny"
allow-git = []
