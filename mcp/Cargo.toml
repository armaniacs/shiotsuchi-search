[package]
name = "shiotsuchi-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
description = "MCP server for Shiotsuchi Search — Claude Desktop integration"

[[bin]]
name = "shiotsuchi-mcp"
path = "src/main.rs"

[dependencies]
shiotsuchi-core = { version = "0.4.2", path = "../core", default-features = false, features = ["watcher", "async-index"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
config = { version = "0.15", features = ["toml"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[features]
default = ["semantic"]
semantic = ["shiotsuchi-core/semantic"]
