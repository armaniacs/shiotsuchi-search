[package]
name = "shiotsuchi-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "shiotsuchi-mcp"
path = "src/main.rs"

[dependencies]
shiotsuchi-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"

[dev-dependencies]
tempfile = "3"
