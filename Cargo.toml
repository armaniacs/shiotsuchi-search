[workspace]
members = ["core", "cli", "mcp", "e2e"]
resolver = "2"

[workspace.package]
version = "0.4.11"
edition = "2021"
authors = ["Shiotsuchi Contributors"]
license = "Apache-2.0"
homepage = "https://github.com/armaniacs/shiotsuchi-search"
repository = "https://github.com/armaniacs/shiotsuchi-search"
readme = "README.md"
keywords = ["search", "japanese", "markdown", "fts5", "vaporetto"]
categories = ["command-line-utilities", "database-implementations", "text-processing"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
