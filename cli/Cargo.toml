[package]
name = "shiotsuchi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "shiotsuchi"
path = "src/main.rs"

[dependencies]
shiotsuchi-core = { path = "../core" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
config = { version = "0.14", features = ["toml"] }
dirs = "5"
thiserror = "1"
notify = "6"
log = "0.4"
env_logger = "0.11"
toml = "0.8"
dialoguer = "0.11"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
