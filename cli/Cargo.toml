[package]
name = "shiotsuchi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
description = "Japanese-aware Markdown search engine — full-text + semantic search for your notes"

[[bin]]
name = "shiotsuchi"
path = "src/main.rs"

[dependencies]
shiotsuchi-core = { version = "0.4.2", path = "../core" }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
config = { version = "0.15", features = ["toml"] }
dirs = "6"
thiserror = "2"
notify = "9.0.0-rc.4"
log = "0.4"
env_logger = "0.11"
toml = "1.1"
dialoguer = "0.12"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
